<!DOCTYPE html>
<!--
  ===== PORTAL WAFFLEFUN · GUÍA RÁPIDA =====
  Los juegos NO se agregan aquí: se agregan en juegos.js (mismo repositorio).
  Este archivo necesita estar junto a logo.png y juegos.js.
  Busca "CAMBIAR:" (colores, frases, tiempos) y "AGREGAR:" (ideas para sumar).
-->
<html lang="es" data-portal>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WaffleFun · Juguetes web</title>
<meta name="description" content="Juguetes web para jugar un ratito: personalidad, agilidad y mucho caos.">
<!-- Vista previa al compartir el link (WhatsApp, Instagram, etc.) -->
<meta property="og:title" content="WaffleFun · Juguetes web">
<meta property="og:description" content="Juguetes web para jugar un ratito. ¡Entra y prueba!">
<meta property="og:image" content="https://wafflefun.github.io/logo.png">
<link rel="icon" href="logo.png">
<style>
  /* CAMBIAR: colores del portal (c1..c4 son los colores del logo) */
  :root { --bg:#140d2e; --ink:#fff7e6; --mut:rgba(255,247,230,.72); --c1:#ffc933; --c2:#2aa3ff; --c3:#ff5b8a; --c4:#9bd13d; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; color:var(--ink); overflow-x:hidden;
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:radial-gradient(circle at 50% 0%,rgba(255,201,51,.3),transparent 55%),
                    radial-gradient(circle at 85% 100%,rgba(42,163,255,.25),transparent 50%), var(--bg);
         padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 28px); }
  #fx { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  main { position:relative; z-index:1; max-width:560px; margin:0 auto; }
  .sr { position:absolute; left:-9999px; }

  /* --- Logo: entra rebotando, flota, y al tocarlo se aplasta y suelta confeti --- */
  .hero { text-align:center; }
  .float { display:inline-block; animation:flota 4s ease-in-out 1.2s infinite; }       /* CAMBIAR: 4s = velocidad de flotar */
  .pop.tap { animation:squish .5s ease; }
  .logo { display:block; width:min(76vw,330px); height:auto; cursor:pointer; -webkit-tap-highlight-color:transparent;
          filter:drop-shadow(0 10px 22px rgba(255,201,51,.4));
          animation:entra 1.1s cubic-bezier(.2,1.5,.4,1) both; }                          /* CAMBIAR: 1.1s = duración de la entrada */
  .frase { min-height:1.6em; margin:4px 0 0; color:var(--mut); font-weight:600; }

  @keyframes entra { 0%{transform:translateY(-140px) scale(.4) rotate(-14deg);opacity:0} 55%{opacity:1} 100%{transform:none;opacity:1} }
  @keyframes flota { 50%{transform:translateY(-9px) rotate(1.5deg)} }
  @keyframes squish { 30%{transform:scale(1.15,.82)} 60%{transform:scale(.92,1.1)} 100%{transform:none} }
  @keyframes sube { from{opacity:0;transform:translateY(34px) scale(.9)} to{opacity:1;transform:none} }

  /* --- Ecosistemas y tarjetas (aparecen una tras otra) --- */
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .card { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:106px; padding:12px;
          border-radius:16px; background:rgba(255,255,255,.09); color:var(--ink); text-decoration:none; text-align:center; font-weight:700;
          border:2px solid var(--a); box-shadow:0 0 16px -8px var(--a); transition:transform .2s, background .2s;
          animation:sube .6s cubic-bezier(.2,1.2,.4,1) both; animation-delay:calc(1.2s + var(--k)*.09s); }
  .card .em { font-size:2.2rem; transition:transform .25s; }
  a.card:hover { transform:translateY(-4px) rotate(-1deg); background:rgba(255,255,255,.16); }
  a.card:hover .em { transform:scale(1.25) rotate(-10deg); }
  a.card:active { transform:scale(.94); }
  a.card:focus-visible { outline:3px solid var(--a); outline-offset:2px; }
  .card.soon { opacity:.5; font-weight:500; border-style:dashed; }
  .card small { color:var(--mut); font-weight:400; }
  footer { margin-top:30px; text-align:center; color:var(--mut); font-size:.85rem; }

  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main>
  <h1 class="sr">WaffleFun</h1>
  <div class="hero">
    <div class="float"><div class="pop" id="pop"><img class="logo" id="logo" src="logo.png" alt="WaffleFun, un waffle sonriente"></div></div>
    <p class="frase" id="frase">Toca el waffle 👆</p>
  </div>
  <div id="lista" style="margin-top:22px"></div>
  <!-- AGREGAR: aquí puede ir el botón "invítame un café" (Ko-fi) o publicidad -->
  <footer>Hecho con cariño · más juguetes pronto</footer>
</main>
<script src="juegos.js"></script>
<script>
  const COLS = ['#ffc933', '#2aa3ff', '#ff5b8a', '#9bd13d'];   // CAMBIAR: colores de las bolitas, el confeti y de cada ecosistema
  const FRASES = ['¡Hola! 👋', '¡Waffle power! 🧇', '¿Jugamos? 🎮','¡Hola, chef! 👨‍🍳','¡Waffle power! 🧇','¡A jugar! 🎮','¡Dulce aventura! 🍓','¡Qué rico! 😋','¡Modo diversión! 🎉','¡A cocinar! 🍳','¡Más chispitas! 🍫','¡Ñam, ñam! 🤤','¡Waffle fiesta! 🥳','¡Qué locura! 🤪','¡A toda máquina! 🚀','¡Dame cinco! ✋','¡Nivel superado! 🏆','¡Un poquito más! 💪','¡Pura dulzura! 🍯','¡Ups, se quemó! 🔥','¡Hora del recreo! 🎈','¡Qué buena pinta! 😍','¡Sigue jugando! 🕹️','¡Waffle mágico! ✨','¡Cuidado, salpica! 💦','¡Dulce victoria! 🥇','¡Más diversión! 🎊','¡Eres un crack! 😎','¡Hasta el último waffle! 🧇','¡Más sirope! 🍯', '¡Eso cosquillea! 😆'];  // CAMBIAR/AGREGAR: frases al tocar el logo
  const rm = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Tarjetas, dibujadas desde juegos.js (todas juntas, sin mostrar ecosistemas; cada una con un color del logo)
  let k = 0, h = '<div class="grid">';
  ECOSISTEMAS.forEach(g => {
    for (const j of g.juegos) {
      const st = ' style="--k:' + k + ';--a:' + COLS[k % 4] + '"';
      h += j.pronto
        ? '<div class="card soon"' + st + '><span class="em">' + j.e + '</span>' + j.n + '<small>Próximamente</small></div>'
        : '<a class="card"' + st + ' href="' + j.u + '"><span class="em">' + j.e + '</span>' + j.n + '</a>';
      k++;
    }
  });
  document.getElementById('lista').innerHTML = h + '</div>';

  // Bolitas flotando de fondo + confeti
  const cv = document.getElementById('fx'), x = cv.getContext('2d');
  let W, H;
  function rs() { const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0); }
  addEventListener('resize', rs); rs();
  const fl = [];
  for (let i = 0; i < 26; i++) fl.push({ x: Math.random() * W, y: Math.random() * H, r: 3 + Math.random() * 7, v: 10 + Math.random() * 25, c: COLS[i % 4], p: Math.random() * 6 });  // CAMBIAR: 26 = cantidad de bolitas
  let cf = [];
  function loop(t) {
    x.clearRect(0, 0, W, H);
    for (const f of fl) {
      f.y -= f.v * 0.016; f.x += Math.sin(t / 1000 + f.p) * 0.3;
      if (f.y < -10) { f.y = H + 10; f.x = Math.random() * W; }
      x.globalAlpha = 0.35; x.fillStyle = f.c; x.beginPath(); x.arc(f.x, f.y, f.r, 0, 7); x.fill();
    }
    cf = cf.filter(p => p.l > 0);
    for (const p of cf) { p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.l -= 0.012; x.globalAlpha = Math.max(0, p.l); x.fillStyle = p.c; x.fillRect(p.x, p.y, 7, 5); }
    x.globalAlpha = 1;
    requestAnimationFrame(loop);
  }
  if (!rm) requestAnimationFrame(loop);

  // Tocar el logo: se aplasta, cambia la frase y suelta confeti
  const pop = document.getElementById('pop'), frase = document.getElementById('frase');
  let fi = 0;
  document.getElementById('logo').addEventListener('click', () => {
    pop.classList.remove('tap'); void pop.offsetWidth; pop.classList.add('tap');
    frase.textContent = FRASES[fi++ % FRASES.length];
    if (rm) return;
    const r = pop.getBoundingClientRect();
    for (let i = 0; i < 45; i++) cf.push({ x: r.left + r.width / 2, y: r.top + r.height / 2, vx: (Math.random() - 0.5) * 9, vy: -Math.random() * 9 - 2, l: 1, c: COLS[i % 4] });  // CAMBIAR: 45 = cantidad de confeti
  });
</script>
</body>
</html>
